<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fensley AI</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: #1c1c1c;
        font-family: "Courier New", Courier, monospace;
        overflow: hidden;
        position: relative;
      }

      .container {
        text-align: center;
        color: #fff;
        position: relative;
        z-index: 2;
        opacity: 0; /* Start hidden for entrance */
        animation: fadeInContainer 1s ease-in-out 0.5s forwards;
      }

      h1 {
        font-size: 3.5em;
        margin: 0;
        letter-spacing: 4px;
        text-transform: uppercase;
        color: #e0e0e0;
        position: relative;
        overflow: hidden;
      }

      h1::before {
        content: "Fensley AI";
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        color: #fff;
        transform: translateX(-100%);
        animation: slideInText 1.5s ease-out 1s forwards;
      }

      p {
        font-size: 1.2em;
        letter-spacing: 2px;
        color: #b0b0b0;
        margin-top: 15px;
        text-transform: uppercase;
        position: relative;
        opacity: 0;
        animation: fadeSlideUp 1s ease-in-out 2s forwards;
      }

      p::after {
        content: "";
        position: absolute;
        bottom: -5px;
        left: 50%;
        width: 0;
        height: 1px;
        background: #e0e0e0;
        transform: translateX(-50%);
        animation: expandLine 1s ease-in-out 2.5s forwards;
      }

      .app-store {
        margin-top: 25px;
        opacity: 0;
        animation: fadeSlideUp 1s ease-in-out 3s forwards;
      }

      .app-store a {
        display: inline-block;
        padding: 10px 20px;
        background: #333333;
        color: #e0e0e0;
        text-decoration: none;
        text-transform: uppercase;
        font-size: 0.9em;
        letter-spacing: 2px;
        border-radius: 3px;
        position: relative;
        overflow: hidden;
        transition: color 0.3s ease;
      }

      .app-store a::before {
        content: "";
        position: absolute;
        top: 0;
        left: -100%;
        width: 100%;
        height: 100%;
        background: #e0e0e0;
        transition: left 0.4s ease;
        z-index: -1;
      }

      .app-store a:hover::before {
        left: 0;
      }

      .app-store a:hover {
        color: #1c1c1c;
      }

      /* Background cinematic effect */
      .bg-effect {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: linear-gradient(
          45deg,
          rgba(255, 255, 255, 0.02),
          transparent
        );
        opacity: 0;
        animation: sweepIn 2s ease-in-out 0.2s forwards,
          pulse 6s infinite ease-in-out 2s;
        z-index: 1;
      }

      @keyframes fadeInContainer {
        0% {
          opacity: 0;
        }
        100% {
          opacity: 1;
        }
      }

      @keyframes slideInText {
        0% {
          transform: translateX(-100%);
        }
        100% {
          transform: translateX(0);
        }
      }

      @keyframes fadeSlideUp {
        0% {
          opacity: 0;
          transform: translateY(20px);
        }
        100% {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes expandLine {
        0% {
          width: 0;
        }
        100% {
          width: 40%;
        }
      }

      @keyframes sweepIn {
        0% {
          opacity: 0;
          transform: translateX(-100%) skewX(30deg);
        }
        100% {
          opacity: 0.5;
          transform: translateX(0) skewX(0deg);
        }
      }

      @keyframes pulse {
        0% {
          opacity: 0.5;
        }
        50% {
          opacity: 0.7;
        }
        100% {
          opacity: 0.5;
        }
      }

      @media (max-width: 600px) {
        h1 {
          font-size: 2.5em;
          letter-spacing: 3px;
        }
        p {
          font-size: 1em;
        }
        .app-store a {
          font-size: 0.8em;
          padding: 8px 16px;
        }
      }
    </style>
  </head>
  <body>
    <div class="bg-effect"></div>
    <div class="container">
      <h1>Fensley AI</h1>
      <p>Web Version Coming Soon!</p>
      <div class="app-store">
        <a
          href="https://apps.apple.com/us/app/fensley-ai/id6742911656"
          target="_blank"
          >Available on Apple</a
        >
      </div>
    </div>
  </body>
</html>
